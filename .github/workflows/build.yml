name: build

# CI：配置 + 全量构建 + 单测（不发布）。
#   * 发布走 .github/workflows/publish-extension.yml（tag 触发）
#   * 这里的目标是"任何人 clone 下来能验证一棵干净的树"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / MSVC / Ninja
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          $env:VSCMD_ARG_TGT_ARCH

      - name: Install winflexbison
        shell: pwsh
        run: |
          # CMake 的 verible-generators.cmake 需要 win_flex / win_bison / FlexLexer.h，
          # 而且它在同一目录下找 FlexLexer.h（#include <FlexLexer.h>）。
          # 注意：choco 的 shim 在 C:\ProgramData\Chocolatey\bin，那里没有头文件，
          # 所以必须用 choco 的 tools 目录，而不是 Get-Command 的目录。
          choco install winflexbison3 -y --no-progress
          $candidates = @(
            'C:\ProgramData\chocolatey\lib\winflexbison3\tools',
            'C:\ProgramData\chocolatey\lib\winflexbison3\tools\win_flex_bison*'
          )
          $dir = $null
          foreach ($c in $candidates) {
            $resolved = Get-ChildItem -Path $c -Directory -ErrorAction SilentlyContinue |
                        Where-Object { Test-Path (Join-Path $_.FullName 'FlexLexer.h') } |
                        Select-Object -First 1
            if ($resolved) { $dir = $resolved.FullName; break }
            if (Test-Path (Join-Path $c 'FlexLexer.h')) { $dir = $c; break }
          }
          if (-not $dir) {
            # 兜底：全盘找一次 FlexLexer.h（choco 版本升级后目录名可能变）
            $hit = Get-ChildItem 'C:\ProgramData\chocolatey\lib\winflexbison3' -Recurse -Filter 'FlexLexer.h' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) { $dir = $hit.DirectoryName }
          }
          if (-not $dir) { throw 'winflexbison: FlexLexer.h not found after choco install' }
          if (-not (Test-Path (Join-Path $dir 'win_flex.exe'))) { throw "win_flex.exe missing in $dir" }
          Add-Content -Path $env:GITHUB_ENV -Value "WINFLEXBISON_DIR=$dir"
          Write-Host "WINFLEXBISON_DIR=$dir"
          Get-ChildItem $dir | Select-Object -First 5 Name

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFPGA_LSP_VERIBLE_ENABLED=ON ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF ^
            -DFPGA_LSP_VERIBLE_ALLOW_LTO=OFF ^
            -DWINFLEXBISON_DIR="%WINFLEXBISON_DIR%"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build

      - name: ctest
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ctest --test-dir build -E docs_clang_tidy --output-on-failure