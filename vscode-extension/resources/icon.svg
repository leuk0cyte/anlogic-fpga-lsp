<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="TangDynasty FPGA chip">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d1d9"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
  </defs>

  <!-- pins: 5 per side -->
  <g fill="url(#pin)">
    <rect x="34" y="6"  width="8" height="18" rx="2"/>
    <rect x="48" y="6"  width="8" height="18" rx="2"/>
    <rect x="62" y="6"  width="8" height="18" rx="2"/>
    <rect x="76" y="6"  width="8" height="18" rx="2"/>
    <rect x="90" y="6"  width="8" height="18" rx="2"/>

    <rect x="34" y="104" width="8" height="18" rx="2"/>
    <rect x="48" y="104" width="8" height="18" rx="2"/>
    <rect x="62" y="104" width="8" height="18" rx="2"/>
    <rect x="76" y="104" width="8" height="18" rx="2"/>
    <rect x="90" y="104" width="8" height="18" rx="2"/>

    <rect x="6"  y="34" width="18" height="8" rx="2"/>
    <rect x="6"  y="48" width="18" height="8" rx="2"/>
    <rect x="6"  y="62" width="18" height="8" rx="2"/>
    <rect x="6"  y="76" width="18" height="8" rx="2"/>
    <rect x="6"  y="90" width="18" height="8" rx="2"/>

    <rect x="104" y="34" width="18" height="8" rx="2"/>
    <rect x="104" y="48" width="18" height="8" rx="2"/>
    <rect x="104" y="62" width="18" height="8" rx="2"/>
    <rect x="104" y="76" width="18" height="8" rx="2"/>
    <rect x="104" y="90" width="18" height="8" rx="2"/>
  </g>

  <!-- chip body -->
  <rect x="24" y="24" width="80" height="80" rx="12" fill="url(#body)" stroke="#58a6ff" stroke-width="3"/>
  <rect x="31" y="31" width="66" height="66" rx="8" fill="none" stroke="#8b949e" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- corner marker -->
  <circle cx="37" cy="37" r="3.2" fill="#f0b72f"/>

  <!-- TD -->
  <text x="64" y="67" text-anchor="middle" dominant-baseline="middle"
        font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-weight="700"
        font-size="34" letter-spacing="1" fill="#f8fafc">TD</text>
</svg>
